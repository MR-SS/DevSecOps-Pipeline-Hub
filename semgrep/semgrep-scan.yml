# Semgrep CI/CD Job
# General SAST scan template

semgrep_scan:
  stage: static-code-analysis
  tags:
    - security
  image: returntocorp/semgrep:latest
  variables:
    SEMGREP_OUTPUT: semgrep-report.json
  script:
    - echo "Running Semgrep scan..."
    # General + Security Audit rules
    - semgrep --config=p/default --config=p/security-audit --json --output "$SEMGREP_OUTPUT"
  artifacts:
    when: always
    paths:
      - "$SEMGREP_OUTPUT"
    expire_in: 1 week
    reports:
      sast: "$SEMGREP_OUTPUT"
